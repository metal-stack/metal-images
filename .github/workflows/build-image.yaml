---
name: Build, test and push metal-image

on:
  workflow_call:
    inputs:
        registry:
            description: The registry to publish the container artifact to.
            default: ghcr.io
            required: false
            type: string
        registry-username:
            description: The registry username to login with.
            default: ${{ github.actor }}
            required: false
            type: string

        target:
            description: The image target in the docker-bake definition
            required: true
            type: string

    secrets:
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
      COSIGN_PUBLIC_KEY:
        required: true
      DOCKER_REGISTRY_PASSWORD:
        description: The registry password to login with. Falls back to the GITHUB_TOKEN CI secret.
        required: false
      GCP_SA_KEY:
        required: true

    outputs:
        image-ref:
          description: The OCI image tag.
          value: ${{ jobs.build.outputs.image-ref }}

env:
  GCS_BUCKET: images.metal-pod.io

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ inputs.registry }}/${{ github.repository }}/${{ inputs.target }}@${{ steps.push.outputs.digest }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Make tags
      id: tag
      uses: metal-stack/actions-common/.github/actions/push-tags@v1
      with:
        default-branch-folder: stable

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Write build meta
      shell: bash
      run: |
        dir=$(dirname $(docker buildx bake -f docker-bake-v2.hcl --print ${{ inputs.target }} | jq -r '.target.${{ inputs.target }}.dockerfile'))

        mkdir -p "${dir}/context/etc/metal"
        cat > "${dir}/context/etc/metal/build.yaml" <<EOF
        builddate: '$(date --iso-8601=seconds)'
        commit_ref: '${{ github.ref_name }}'
        commit_sha1: '${{ github.sha }}'
        gitrepo: '${{ github.repository }}'
        EOF

        cat "${dir}/context/etc/metal/build.yaml"

    - name: Build image
      uses: docker/bake-action@v7
      with:
        source: .
        files: ./docker-bake-v2.hcl
        targets: ${{ inputs.target }}
        no-cache: true

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ secrets.DOCKER_REGISTRY_PASSWORD != '' && secrets.DOCKER_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

    - name: Push image
      id: push
      uses: ./.github/actions/oras-push
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      with:
        image: ${{ inputs.registry }}/${{ github.repository }}/${{ inputs.target }}
        tag: ${{ steps.tag.outputs.container_tag }}
        artifact-type: application/vnd.metal-stack.os-image.v1
        media-type: application/vnd.metal-stack.os-image.v1.tar+lz4
        file: img.tar.lz4
        sbom: sbom.spdx.predicate.json
        pre-push-command: |
          # extract the sbom
          tar -xf ./img.tar sbom.spdx.json
          jq '.predicate' sbom.spdx.json > sbom.spdx.predicate.json

          lz4 -f -9 ./img.tar img.tar.lz4

    # - uses: google-github-actions/auth@v3
    #   with:
    #     credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # - name: Setup gcloud
    #   uses: google-github-actions/setup-gcloud@v3

    # - name: Upload image tarballs to GCS
    #   shell: bash
    #   run: |
        # md5sum img.tar.lz4 > img.tar.lz4.md5
        # sha512sum img.tar.lz4 > img.tar.lz4.sha512
        # cd image
        # gcloud storage cp --cache-control=no-store --recursive . gs://${{ inputs.bucket }}/${{ inputs.path-prefix }}/${{ steps.tag.outputs.folder }}/

  test:
    name: Test Image
    runs-on: self-hosted
    timeout-minutes: 30
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Oras
        uses: oras-project/setup-oras@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Prepare
        shell: bash
        run: |
            echo "remove old firecracker images"
            sudo rm -rf /var/lib/firecracker/image/* /var/lib/firecracker/kernel/*

            echo "download cloud-hypervisor"
            CLOUD_HYPERVISOR_PATH="/usr/local/bin/cloud-hypervisor"
            CLOUD_HYPERVISOR_VERSION="v51.1"
            sudo rm -f ${CLOUD_HYPERVISOR_PATH}
            sudo wget -qO ${CLOUD_HYPERVISOR_PATH} https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/${CLOUD_HYPERVISOR_VERSION}/cloud-hypervisor-static
            sudo chmod +x ${CLOUD_HYPERVISOR_PATH}

      - name: Run
        shell: bash
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
            set -x
            echo "verify image signature"
            echo "${COSIGN_PUBLIC_KEY}" > cosign.pub
            cosign verify --key cosign.pub "${{ needs.build.outputs.image-ref }}"

            echo "download image"
            timeout 300 oras pull "${{ needs.build.outputs.image-ref }}"

            echo "decompress image tar"
            chmod +x test/lz4
            ./test/lz4 -d -f img.tar.lz4 img.tar

            echo "Testing ${{ needs.build.outputs.image-ref }}"

            cd test

            chmod 0600 ./files/key
            chmod 0644 ./files/key.pub

            sudo OS_NAME="${{ inputs.target }}" ./test.sh
